services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build: .
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - INNGEST_DEV_SERVER_URL=http://host.docker.internal:8288
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - shared_uploads:/app/uploads
    depends_on:
      - qdrant

  frontend:
    build: .
    command: uv run streamlit run streamlit_app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - INNGEST_DEV_SERVER_URL=http://host.docker.internal:8288
    volumes:
      - shared_uploads:/app/uploads
    depends_on:
      - backend

volumes:
  qdrant_storage:
  shared_uploads: